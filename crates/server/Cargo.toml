[package]
name = "ox-server"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "axum HTTP handlers exposing ox-codes' search, rewrite, and dataflow engines as a JSON API."
keywords = ["code-search", "http-api", "axum", "static-analysis"]
categories = ["development-tools", "web-programming::http-server"]

[dependencies]
ox-core = { path = "../core", version = "0.1.1" }
ox-dataflow = { path = "../dataflow", version = "0.1.1" }
ox-langs = { path = "../langs", version = "0.1.1" }
axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
ignore = "0.4"
globset = "0.4"
moka = { version = "0.12", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
