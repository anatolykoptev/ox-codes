[workspace]
resolver = "2"
members = ["crates/core", "crates/dataflow", "crates/langs", "crates/server"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Anatoly Koptev"]
repository = "https://github.com/anatolykoptev/ox-codes"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "ox-codes"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Code search, structural rewrite, and dataflow analysis as an HTTP service — ripgrep + tree-sitter + ast-grep behind one JSON API."
keywords = ["code-search", "ripgrep", "tree-sitter", "ast-grep", "dataflow"]
categories = ["development-tools", "command-line-utilities", "web-programming::http-server"]

[dependencies]
ox-core = { path = "crates/core", version = "0.1.3" }
ox-langs = { path = "crates/langs", version = "0.1.3" }
ox-server = { path = "crates/server", version = "0.1.3" }
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
