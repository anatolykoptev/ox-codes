name: Release

# Canonical release-please flow (skill: release-please-setup, gotcha 3): the
# publish job runs in the SAME workflow as release-please, gated on release_created,
# so it does not depend on a tag push triggering a separate workflow. ox-codes is a
# PUBLIC repo, so GitHub-hosted Actions are free — this replaces the fleet's local
# release-please for this repo (ox-codes removed from ~/bin/release-please-local.sh).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish every workspace crate to crates.io, gated on a release being cut this run.
  # crates.io Trusted Publishing (OIDC) — no long-lived token. The crates.io Trusted
  # Publisher for EACH crate must name this workflow file (Release.yml -> release-please.yml).
  publish:
    name: Publish crates.io
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write   # OIDC for crates.io Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - name: Verify root Cargo.toml version matches the tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          CARGO_VERSION=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "$CARGO_VERSION" = "$TAG_VERSION" ] || { echo "::error::version mismatch Cargo.toml=$CARGO_VERSION tag=$TAG_VERSION"; exit 1; }
      - name: crates.io Trusted Publishing (OIDC → short-lived token)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in ox-langs ox-core ox-dataflow ox-server ox-codes; do
            echo "::group::publish $crate"
            cargo publish -p "$crate"
            echo "::endgroup::"
          done
