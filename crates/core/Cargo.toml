[package]
name = "ox-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Code search engine (grep, scoped, structural, rewrite) over ripgrep + tree-sitter + ast-grep (part of ox-codes)."
keywords = ["code-search", "ripgrep", "tree-sitter", "ast-grep", "refactoring"]
categories = ["development-tools", "parsing"]

[dependencies]
ox-langs = { path = "../langs", version = "0.1.0" }
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
globset = "0.4"
tree-sitter = "0.26"
ast-grep-core = "0.42"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24.2"
tree-sitter-bash = "0.25.1"
tree-sitter-lua = "0.5.0"
tree-sitter-swift = "0.7.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-zig = "1.1.2"
moka = { version = "0.12", features = ["sync"] }
similar = "2"
tempfile = "3"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
