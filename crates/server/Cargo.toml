[package]
name = "ox-server"
version = "0.1.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "axum HTTP handlers exposing ox-codes' search, rewrite, and dataflow engines as a JSON API."
keywords = ["code-search", "http-api", "axum", "static-analysis"]
categories = ["development-tools", "web-programming::http-server"]

[dependencies]
ox-core = { path = "../core", version = "0.1.4" }
ox-dataflow = { path = "../dataflow", version = "0.1.4" }
ox-langs = { path = "../langs", version = "0.1.4" }
axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
globset = "0.4"

[dev-dependencies]
tempfile = "3"
